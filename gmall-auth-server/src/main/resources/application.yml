server:
  port: 1700
  servlet:
    session:
      timeout: 30m #session超时时间为30min

spring:
  application:
    name: gmall-auth-server

  cloud:
    nacos:
      discovery:
        server-addr: 120.76.60.77:9848

    sentinel:
      transport:
        dashboard: 127.0.0.1:8080 #Sentinel控制台的访问地址
        port: 8719  #Sentinel和自己服务整合需要的端口

  #服务追踪
  zipkin:
    base-url: http://192.168.1.4:9411/ #zipkin服务器的地址
    discovery-client-enabled: false #关闭服务的发现，否则springCloud会把zipkin的url当做服务名称
    sender:
      type: web #使用 http 方式传输数据
  sleuth:
    sampler:
      probability: 1 #设置抽样采集率 1就是100% 默认0.1，即10%

  thymeleaf:
    cache: false

  redis:
    host: 120.76.60.77
    port: 7379
    password: sherlock
    timeout: 1000 #超时时间(毫秒)
    jedis:
      pool:
        max-active: 50 #连接池最大连接数（使用负值表示没有限制）
        max-wait: -1   #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-idle: 10    #连接池中的最大空闲连接
        min-idle: 5    #连接池中的最小空闲连接

  session:
    store-type: redis

oauth2:
  weibo:
    client_id: 1509412573
    client_secret: c08bbf7a9174e5f218f8125f997ed2bd
    grant_type: authorization_code
    redirect_uri: http://auth.gmall.com/oauth2.0/weibo/success

swagger:
  enabled: true
server:
  port: 1901

spring:
  application:
    name: gmall-seckill

  redis:
    host: 120.76.60.77
    password: sherlock
    port: 7379
    timeout: 1000 #超时时间(毫秒)
    jedis:
      pool:
        max-active: 50 #连接池最大连接数（使用负值表示没有限制）
        max-wait: -1   #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-idle: 10    #连接池中的最大空闲连接
        min-idle: 5    #连接池中的最小空闲连接

  cloud:
    nacos:
      discovery:
        server-addr: 120.76.60.77:9848

    sentinel:
      transport:
        dashboard: 127.0.0.1:8080 #Sentinel控制台的访问地址
        port: 8719  #Sentinel和自己服务整合需要的端口


  session:
    store-type: redis

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss

  thymeleaf:
    cache: false
  rabbitmq:
    host: 192.168.1.4
    port: 5672
    virtual-host: /
    username: guest
    password: guest
    #publisher-confirms: true #开启发送端确认 发送端->rabbitmq服务器 publisher-confirm-type
    publisher-confirm-type: correlated  #配合CorrelationData类使用，发送消息时添加消息的唯一ID
    publisher-returns: true #开启发送端确认 rabbitmq服务器(交换机)->queue 没有到达才会触发
    template:
      mandatory: true #只要消息抵达队列，以异步的方式优先回调 returnConfirm 接口
    listener:
      simple:
        acknowledge-mode: manual #手动确认收货(消息被正确消费)
        retry:
          enabled: true
          max-attempts: 5 #最大重试5次
          initial-interval: 20000 #失败重试的时间间隔
logging:
  level:
    com.sherlock.gmall: debug
    com.alibaba.nacos.client.naming: error

#是否开启 swagger-ui
#暂时先关闭了，不然每次启动的时候会比较慢
swagger:
  enabled: false

#自定义线程池配置
gmall:
  thread:
    core-pool-size: 10
    maximum-pool-size: 200
    keep-alive-time: 10


server:
  port: 1901

spring:
  application:
    name: gmall-seckill

  redis:
    host: 120.76.60.77
    password: sherlock
    port: 7379
    timeout: 1000 #超时时间(毫秒)
    jedis:
      pool:
        max-active: 50 #连接池最大连接数（使用负值表示没有限制）
        max-wait: -1   #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-idle: 10    #连接池中的最大空闲连接
        min-idle: 5    #连接池中的最小空闲连接

  cloud:
    nacos:
      discovery:
        server-addr: 120.76.60.77:9848

  session:
    store-type: redis

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss

logging:
  level:
    com.sherlock.gmall: debug
    com.alibaba.nacos.client.naming: error

#是否开启 swagger-ui
#暂时先关闭了，不然每次启动的时候会比较慢
swagger:
  enabled: false

#自定义线程池配置
gmall:
  thread:
    core-pool-size: 10
    maximum-pool-size: 200
    keep-alive-time: 10

